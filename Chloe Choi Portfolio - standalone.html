  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

alleryIndex: {}, webGalleryIndex: {}, filter: 'ALL', revealedWork: {}, mouseX: -100, mouseY: -100, cursorVisible: false, chaosHovered: false, arrowHovered: false };\n  galleryCount = 5;\n  webGalleryCount = 4;\n\n  webProjectsData = [\n    { title: 'Vinson & Elkins 2026 Brand Guidelines', subtitle: 'V&E Brand Refresh Initiative Internship Project', slotId: 'web-2', galleryId1: 'web-2-shot1', galleryId2: 'web-2-shot2', galleryId3: 'web-2-shot3', placeholder: 'Site mockup — portfolio grid', role: 'Art direction, front-end', year: '2026', tools: 'Figma, Webflow', description: 'A portfolio site for a photographer friend, built around a full-bleed image grid that lets the work speak first. I hand-built the front end for fast load times on large images, with a lightbox transition tuned to feel like flipping through a physical print portfolio.' },\n    { title: 'Curby Website', subtitle: 'Free Curb side Pickup Website', slotId: 'web-1', galleryId1: 'web-1-shot1', galleryId2: 'web-1-shot2', galleryId3: 'web-1-shot3', placeholder: 'Site mockup — homepage', role: 'UX/UI, Webflow build', year: '2026', tools: 'Figma, Webflow', description: \"Foundry Coffee needed a site as no-frills and confident as its roast. I designed and built a single-page Webflow site with a stamped, industrial type system, a scrolling menu that doubles as tasting notes, and a store locator built for one-handed use on a phone while standing in line.\" },\n    { title: 'Pixel Slider Lab', subtitle: '30 Interactive Pixel Sliders', slotId: 'web-3', galleryId1: 'web-3-shot1', galleryId2: 'web-3-shot2', galleryId3: 'web-3-shot3', placeholder: 'Site mockup — shop page', role: 'UX/UI, Shopify build', year: '2026', tools: 'Figma, Shopify', galleryCount: 3, description: \"An online shop extension of the Bloom Botanicals brand identity, built on Shopify with custom product templates that carry the shop's hand-illustrated motifs into checkout, cart, and order confirmation emails.\" },\n    { title: 'Choose Your Destiny', subtitle: 'Interactive Story', slotId: 'web-4', galleryId1: 'web-4-shot1', galleryId2: 'web-4-shot2', galleryId3: 'web-4-shot3', placeholder: 'Site mockup — magazine layout', role: 'UI/UX design, HTML, Javascript, CSS', year: '2026', tools: 'Github, ASCII Art Generator', description: 'This project is a coded interactive website using only HTML, CSS, and JavaScript. It is a narrative-driven “choose your destiny” experience that invites users to explore a surreal dreamland shaped by memory, choice, and perception. Through branching paths and atmospheric storytelling, each decision leads to new environments and consequences, encouraging replay and personal interpretation. The story is designed as a looping system, where multiple endings subtly reconnect to the beginning, reinforcing the cyclical nature of dreams. The project blends narrative design, user experience, and visual structure to create an immersive, reflective digital experience.' },\n  ];\n\n  projects = [\n    { title: 'Art, Identity, and Memory at Parsons', category: 'MAGAZINE', slotId: 'project-4', spotSlotId: 'spotlight-nightshift', placeholder: 'Nightshift Records — gig poster', spotlight: true, embedUrl: 'https://indd.adobe.com/view/51bf9127-e74a-4522-8b41-9b6911213a5a', role: 'Magazine, Interview', year: '2026', tools: 'Adobe Indesign, Adobe Photoshop', description: \"This editorial publication explores the story of multidisciplinary artist Valeska through a long-form interview centered on identity, creativity, and artistic growth. Designed as both a magazine and booklet, the publication documents an intimate conversation about her experiences as a minority artist, the influences that have shaped her creative practice, and her journey as a student at Parsons School of Design.\\n\\nThe project combines editorial storytelling with thoughtful visual design to create an engaging reading experience. Every aspect of the publication—from typography and layout to image placement and pacing—was carefully considered to complement the interview and reinforce its themes. The design balances moments of reflection with dynamic visual compositions, allowing the narrative to unfold naturally while highlighting Valeska's work and personal perspective.\\n\\nThis project challenged me to translate a deeply personal conversation into a cohesive editorial piece, emphasizing both clarity and emotional resonance through publication design.\" },\n    { title: '37889 Studios Mezcal Brand Identity', category: 'BRANDING', slotId: 'project-1', spotSlotId: 'spotlight-bloom', placeholder: 'Bloom Botanicals — brand identity', spotlight: true, allowFigma: true, role: 'Brand Identity, Packaging, Logo, Figurative Marks', year: '2026', tools: 'Adobe Illustrator, Procreate, Figma', description: \"As my final capstone project during my internship at 37889 Studios, I was tasked with developing a complete brand identity for the studio's new mezcal product line. Building upon the existing 37889 Studios brand, I created a visual identity that felt authentic to the company while establishing a distinct personality for the mezcal collection.\\n\\nThe project began with extensive concept exploration, including logo development inspired by the studio's existing mark, naming iterations, product storytelling, and packaging research. I experimented with multiple brand directions, refining product names, descriptions, figurative marks, typography, color palettes, and label layouts to create a cohesive premium spirits brand.\\n\\nThe final identity balances tradition and modern design, drawing from mezcal's artisanal heritage while maintaining a contemporary aesthetic that aligns with the 37889 Studios brand. The resulting packaging system was designed to stand out on the shelf while communicating craftsmanship, authenticity, and sophistication.\" },\n    { title: 'AYOBA Inc. Motion Graphics Editing', category: 'MOTION GRAPHICS', slotId: 'project-9', spotSlotId: 'spotlight-ayoba', placeholder: 'AYOBA Inc. — motion graphics reel', spotlight: true, embedUrl: 'https://player.vimeo.com/video/1211777679', role: 'Motion graphics, editing', year: '2025', tools: 'After Effects, Premiere Pro', description: \"During my summer internship at AYOBA Inc., a creative studio in South Korea specializing in motion graphics and commercials, I collaborated on a branded video for Dr. Jart that explains the concept of the skin barrier and how the brand's products help support it. I contributed to research and content development, translated materials from Korean to English, and assisted in editing within After Effects. My role included animating basic elements using keyframes and rendering select graphics for the final commercial.\" },\n    { title: 'Wikipedia Book Project', category: 'BOOK DESIGN', slotId: 'project-2', placeholder: 'Ravenscroft Journal — spread', spotlight: false, embedUrl: 'https://indd.adobe.com/view/5ec83d42-f9de-4d9e-a98b-fd552acb6842', role: 'Editorial design, typesetting', year: '2025', tools: 'InDesign', description: \"For this project, I transformed a long-form Wikipedia entry into a printed, book-format publication, exploring how digital systems of navigation and information can be translated into a physical medium. I selected the A24 Wikipedia page as my source content and incorporated the full text into a 16-page, saddle-stitched booklet, considering how elements such as hierarchy, structure, and navigational clarity could be reimagined for print. Using Akzidenz Grotesk as the sole typeface, I focused on creating visual consistency and a coherent reading experience while investigating the challenges of adapting web-based features to traditional book design.\" },\n    { title: 'Manifesto Poster', category: 'POSTER DESIGN', slotId: 'project-3', placeholder: 'Terra Ceramics — packaging', spotlight: false, galleryCount: 3, galleryAspects: ['3/4', '3/4', '16/9'], role: 'Packaging design', year: '2024', tools: 'Illustrator, physical prototyping', description: 'Terra Ceramics sells small-batch tableware and wanted packaging that photographed well for unboxing videos and held up to shipping. I designed a die-cut box system with an interior print inspired by glaze textures, plus a wrap band carrying the maker\\'s story in a few lines of copy.' },\n    { title: 'New Worlds', category: 'BRANDING', slotId: 'project-5', placeholder: 'Foundry Coffee — brand identity', spotlight: false, galleryCount: 3, galleryAspects: ['3/4', '3/4', '16/9'], role: 'Brand identity, package design, poster design', year: '2026', tools: 'Photoshop, Illustrator, InDesign', description: \"TAG TOWN is a speculative branding project centered on creating a typographic identity system for a fictional utopian city where graffiti is embraced as a form of public expression rather than treated as vandalism. The project explores how typography can extend beyond communication to shape culture, identity, and the experience of a place.\\n\\nThe concept imagines a city where every wall serves as a collaborative canvas, celebrating creativity, authorship, and community. Inspired by the visual language of street art, I designed a custom graffiti-influenced typeface and developed a flexible visual identity that reflects the city's values of openness and self-expression. The logo features a spray bottle integrated with the letter \\\"T,\\\" functioning as both a recognizable symbol and a typographic mark for the city.\\n\\nTo bring TAG TOWN to life, I expanded the identity across a range of applications, including posters, environmental signage, merchandise, and art supplies. These mockups demonstrate how the brand system functions consistently across different touchpoints while reinforcing the city's personality and creating a believable, lived-in world.\\n\\nThis project challenged me to think beyond a single logo by building a complete identity system, using typography as the foundation for storytelling, world-building, and visual communication.\" },\n    { title: 'Everyday Poster Redesign', category: 'POSTER DESIGN', slotId: 'project-6', placeholder: 'Paper Trail Zine — cover', spotlight: false, galleryCount: 4, galleryAspects: ['16/9', '3/4', '3/4', '3/4'], role: 'POSTER DESIGN', year: '2025', tools: 'InDesign, Illustrator, Canva', description: \"This project involved redesigning everyday informational posters, including “Take the Stairs” and “Wash Your Hands,” that are commonly found in medical and educational settings. I chose this project to address how traditional posters often feel visually dull, overly text-heavy, and easy to ignore despite their importance. My goal was to make these messages more engaging and accessible through a modern, design-driven approach while preserving their original educational intent.\\n\\nMy approach began with researching existing posters and analyzing their effectiveness, particularly in terms of hierarchy, clarity, and visual appeal. From there, I identified which elements were essential to keep and which could be reimagined. Using bold color choices, clear typographic hierarchy, and dynamic layout elements, I created redesigned posters that communicate simple instructions in a way that feels more inviting, contemporary, and attention-grabbing.\" },\n    { title: 'Advertisement', category: 'VIDEO EDITING', slotId: 'project-7', placeholder: 'Advertisement — video', spotlight: false, embedUrl: 'https://player.vimeo.com/video/1212712915', role: 'Video editing, color grading', year: '2026', tools: 'Premiere Pro', description: \"As part of my internship at 37889 Studios, I edited a promotional advertisement for Omi Health, a company developing a biomarker app that helps dog owners monitor and better understand their pets' health. The goal of the advertisement was to introduce the product through a relatable, everyday moment that emphasizes the bond between people and their pets.\\n\\nThe commercial follows a man as he bathes and plays with his dog, capturing genuine interactions that reinforce themes of care, trust, and wellness. My role focused on editing the footage into a concise, engaging narrative by refining pacing, selecting shots, and creating smooth transitions that supported the story while maintaining a polished, natural flow.\\n\\nThis project strengthened my understanding of commercial video editing and demonstrated how thoughtful pacing and storytelling can effectively communicate a brand's message within a short-form advertisement.\" },\n    { title: 'SKYLARK Reel', category: 'POSTER', slotId: 'project-8', placeholder: 'Midnight Radio — poster series', spotlight: false, embedUrl: 'https://www.canva.com/design/DAGx1JOTM8o/Kq3q5KxshV7vtWy3FTmE0w/watch?embed', embedAspect: '177.7778%', role: 'Video editing, and social media marketing', year: '2025', tools: 'Illustrator', description: \"This motion reel was created as part of my application for the SKYLARK internship program, showcasing my abilities in video editing, motion graphics, and visual storytelling. The objective was to create a fast-paced, engaging piece that highlighted both my technical skills and creative perspective while reflecting my personal design style.\\n\\nI curated and edited a selection of my creative work into a cohesive narrative, focusing on rhythm, pacing, and seamless transitions to maintain visual interest throughout the reel. Through careful sequencing, typography, music synchronization, and motion design, I crafted a dynamic presentation that effectively communicated my experience across branding, graphic design, and multimedia projects.\\n\\nThis project challenged me to distill a broad range of work into a concise and impactful portfolio piece, reinforcing the importance of storytelling, timing, and presentation in communicating a designer's identity.\" },\n  ];\n  categoryList = ['ALL', 'BRANDING', 'EDITORIAL', 'PACKAGING', 'POSTER', 'BOOK DESIGN', 'POSTER DESIGN', 'MOTION GRAPHICS', 'VIDEO EDITING'];\n  observer = null;\n\n  componentDidMount() {\n    try {\n
